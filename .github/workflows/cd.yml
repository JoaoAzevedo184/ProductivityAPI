name: CD

# ============================================================
# Dispara só em merge na main (ou trigger manual).
# O ci.yml já roda lint + test + security em todo push/PR,
# então aqui o foco é EMPACOTAR e PUBLICAR a imagem.
# ============================================================
on:
  push:
    branches: [main]
  workflow_dispatch:        # permite rodar manualmente pela UI do GitHub

# Evita dois deploys simultâneos da main pisando um no outro.
# Diferente do CI, NÃO cancelamos em progresso — um deploy não deve
# ser interrompido no meio.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # github.repository = "JoaoAzevedo184/ProductivityAPI" -> vira o nome da imagem.
  # toLowerCase porque o GHCR exige nome de imagem em minusculas.
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ============================================================
  # Job 1: Build + Push da imagem Docker pro GHCR
  # ============================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write          # necessario pra publicar no GHCR

    # Expoe a tag gerada pros jobs seguintes (deploy)
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Normaliza o nome da imagem pra minusculas (GHCR exige).
      - name: Lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatico, nao precisa criar

      # Gera tags e labels automaticamente:
      #   - sha-<7chars> (rastreabilidade por commit)
      #   - latest (so na main)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # O Dockerfile esta em productivity-api/, nao na raiz
          context: ./productivity-api
          file: ./productivity-api/Dockerfile
          push: true
          # provenance/sbom: false -> imagem SEM atestacoes OCI.
          # Repo publico adiciona provenance mode=max por padrao, o que cria
          # uma camada "unknown/unknown" que o `kind load` rejeita com
          # "content digest ... not found". Desligar gera imagem Docker-padrao,
          # compativel com Kind.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache via GitHub Actions — acelera builds subsequentes
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "## Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # Job 2: Deploy em STAGING (automatico apos push da imagem)
  #
  # NOTA HONESTA: o cluster Kind roda LOCALMENTE (no PC do dev).
  # Um runner do GitHub na nuvem NAO alcanca o Kind local.
  # Por isso, este job documenta o comando de deploy real que
  # seria executado, mas nao o aplica num cluster remoto.
  #
  # O deploy real e feito localmente via scripts/deploy-local.sh,
  # reproduzindo exatamente este comando.
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging       # GitHub Environment (configuravel em Settings)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy command (demonstrativo)
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
          echo "## Deploy em Staging" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Comando de deploy (executado localmente no cluster Kind):" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "./scripts/deploy-local.sh staging ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy de staging documentado para a tag ${IMAGE_TAG}"

  # ============================================================
  # Job 3: Deploy em PRODUCAO (exige APROVACAO MANUAL)
  #
  # O environment "production" deve ter "Required reviewers"
  # configurado em Settings -> Environments -> production.
  # Quando o pipeline chega aqui, PAUSA e aguarda alguem clicar
  # "Approve and deploy" na aba Actions.
  # ============================================================
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production    # configurar required reviewers aqui

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy command (demonstrativo)
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
          echo "## Deploy em Producao (aprovado)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Comando de deploy (executado localmente no cluster Kind):" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "./scripts/deploy-local.sh prod ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy de producao aprovado para a tag ${IMAGE_TAG}"