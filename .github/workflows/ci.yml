name: CI

# Dispara o pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:           # permite rodar manualmente

# Evita múltiplos pipelines rodando ao mesmo tempo na mesma branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permissões mínimas (boa prática de segurança)
permissions:
  contents: read

jobs:

  # ============================================================
  # Job 1: Lint (fail fast)
  # Roda primeiro — falha em segundos se código mal formatado
  # ============================================================
  lint:
    name: Lint (Spotless)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./productivity-api/mvnw

      - name: Run Spotless
        working-directory: productivity-api
        run: ./mvnw -B spotless:check

  # ============================================================
  # Job 2: Build + Test + Qualidade
  # ============================================================
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    needs: lint                    # só roda se lint passar
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./productivity-api/mvnw

      - name: Build + Test + Analysis
        working-directory: productivity-api
        run: ./mvnw -B verify
        # roda compile + testes + JaCoCo (cobertura) + SpotBugs (análise estática)

      # Upload de artefatos (mesmo se falhar — útil pra debugar falhas)
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: productivity-api/target/site/jacoco/
          retention-days: 7

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: productivity-api/target/spotbugs/
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: productivity-api/target/surefire-reports/
          retention-days: 7

      # Resumo visível direto no GitHub
      - name: Job Summary
        if: always()
        run: |
          echo "## 📊 Resultados do CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Descrição |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| jacoco-report | Cobertura de testes (HTML) |" >> $GITHUB_STEP_SUMMARY
          echo "| spotbugs-report | Bugs estáticos detectados |" >> $GITHUB_STEP_SUMMARY
          echo "| surefire-reports | Resultado dos testes unitários |" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Job 3: Segurança (OWASP + NVD)
  # Roda em paralelo com build-and-test pra não atrasar feedback
  # ============================================================
  security-scan:
    name: Security Scan (OWASP)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sem cache: maven aqui — o cache da NVD logo abaixo gerencia o subdiretório
      # que precisamos. Misturar os dois cria conflito de restauração.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Cache do banco de vulnerabilidades (evita download pesado ~500MB).
      # Chave baseada no pom.xml — invalida só quando as dependências mudam.
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: Make mvnw executable
        run: chmod +x ./productivity-api/mvnw

      # NVD_API_KEY é obrigatória desde 2023: sem ela, rate limit derruba o scan.
      # Gere em https://nvd.nist.gov/developers/request-an-api-key e configure
      # em Settings → Secrets and variables → Actions.
      - name: Run OWASP Dependency Check
        working-directory: productivity-api
        run: ./mvnw -B org.owasp:dependency-check-maven:check -DnvdApiKey=${{ secrets.NVD_API_KEY }}
        continue-on-error: true
        # não quebra o build (modo observação)
        # depois você pode mudar para false pra bloquear PR

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: productivity-api/target/dependency-check-report.*
          retention-days: 7