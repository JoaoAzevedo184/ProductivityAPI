# ============================================================
# docker-compose.yml — Stack de logging centralizado (Desafio 04)
#
# Sobe quatro servicos:
#   - init-logs       -> ajusta permissoes do volume (roda uma vez e morre)
#   - syslog-ng       -> coletor central de logs
#   - postgres        -> banco, loga via syslog
#   - productivity-api -> aplicacao, loga via syslog
#
# DECISOES (Docker Desktop + linuxserver/syslog-ng):
#   1. syslog-address: udp://127.0.0.1:514
#      * localhost resolve pra ::1 (IPv6) -> usa 127.0.0.1 pra forcar IPv4
#      * UDP nao trava o boot se o coletor ainda estiver subindo
#   2. Portas mapeadas: externo 514 -> interno 5514
#      * a imagem linuxserver/syslog-ng roda non-root, escuta em 5514
#   3. Init container faz chown do volume (PUID=1000):
#      * sem isso, syslog-ng (UID 1000) nao consegue escrever no /var/log/docker
#        criado como root pelo Docker
#   4. Sem healthcheck do syslog-ng:
#      * a imagem nao tem netstat/ss/nc, e a porta UDP nao aparece em /proc/net/tcp
# ============================================================

services:

  # ----------------------------------------------------------
  # Init container — ajusta permissoes do volume e some.
  # Sem isso, syslog-ng (UID 1000) nao consegue escrever
  # no /var/log/docker que o Docker cria como root.
  # ----------------------------------------------------------
  init-logs:
    image: alpine:3.20
    container_name: syslog-ng-init
    command: ["sh", "-c", "chown -R 1000:1000 /var/log/docker && echo 'permissoes ajustadas'"]
    volumes:
      - syslog-data:/var/log/docker
    restart: "no"

  # ----------------------------------------------------------
  # Syslog-ng — coletor central
  # ----------------------------------------------------------
  syslog-ng:
    image: lscr.io/linuxserver/syslog-ng:latest
    container_name: syslog-ng
    depends_on:
      init-logs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:514:5514/tcp"
      - "127.0.0.1:514:5514/udp"
      - "127.0.0.1:601:6601/tcp"   # syslog estruturado (RFC 5425), uso futuro
    volumes:
      - ./config:/config
      - syslog-data:/var/log/docker
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Recife
    restart: unless-stopped
    networks:
      - logging-net

  # ----------------------------------------------------------
  # PostgreSQL — loga via syslog
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: productivity-postgres-logging   # era productivity-postgres
    depends_on:
      syslog-ng:
        condition: service_started
    environment:
      POSTGRES_DB: productivity
      POSTGRES_USER: productivity
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - logging-net
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        tag: "productivity-postgres"
        syslog-format: "rfc5424"

  # ----------------------------------------------------------
  # productivity-api — loga via syslog
  # ----------------------------------------------------------
  api:
    image: ghcr.io/joaoazevedo184/productivityapi:latest
    container_name: productivity-api-logging          # era productivity-api
    depends_on:
      syslog-ng:
        condition: service_started
      postgres:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/productivity
      DB_USER: productivity
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8081:8080"
    networks:
      - logging-net
    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        tag: "productivity-api"
        syslog-format: "rfc5424"

# ----------------------------------------------------------
# Volumes e Networks
# ----------------------------------------------------------
volumes:
  syslog-data:
    name: syslog-ng-logs
  pgdata:
    name: productivity-pgdata-logging

networks:
  logging-net:
    driver: bridge