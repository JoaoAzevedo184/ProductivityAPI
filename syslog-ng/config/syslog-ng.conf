@version: 4.5
@include "scl.conf"

# ============================================================
# syslog-ng.conf — Desafio 04
# Coleta logs via rede (TCP/UDP 514) e organiza em
# /var/log/docker/<host>/<ano>/<mês>/<dia>.log
# ============================================================

# ============================================================
# Sources — de onde os logs chegam
# ============================================================
source s_network {
    # TCP é mais confiável (sem perda em rajadas) — é o que o compose usa
    network(
        ip("0.0.0.0")
        port(5514)
        transport("tcp")
        flags(syslog-protocol)
    );

    # UDP mantido para clientes legados (não-Docker)
    network(
        ip("0.0.0.0")
        port(5514)
        transport("udp")
        flags(syslog-protocol)
    );
};

# ============================================================
# Template — como organizar os arquivos no disco
# Hierarquia: host / ano / mês / dia.log
# ============================================================
template t_logs {
    template("/var/log/docker/${HOST}/${YEAR}/${MONTH}/${DAY}.log");
    template_escape(no);
};

# ============================================================
# Destinations — para onde escrever
# ============================================================

# Destino principal: todos os logs, organizados por host/data
destination d_logs {
    file(
        template(t_logs)
        create_dirs(yes)        # cria a hierarquia automaticamente
        dir-perm(0755)
        perm(0644)
    );
};

# Destino de erros: bucket separado pra facilitar auditoria
destination d_errors {
    file(
        "/var/log/docker/_errors/${YEAR}-${MONTH}-${DAY}.log"
        create_dirs(yes)
        dir-perm(0755)
        perm(0644)
    );
};

# ============================================================
# Filters
# ============================================================
# Captura só logs de severidade error ou pior (err, crit, alert, emerg)
filter f_errors { level(err..emerg); };

# ============================================================
# Pipelines (log paths)
# ============================================================

# Pipeline 1: TUDO vai pro destino organizado por host/data
log {
    source(s_network);
    destination(d_logs);
};

# Pipeline 2: erros TAMBÉM vão pro bucket de erros
log {
    source(s_network);
    filter(f_errors);
    destination(d_errors);
};