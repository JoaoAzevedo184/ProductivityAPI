@version: 4.5
@include "scl.conf"

# ============================================================
# syslog-ng.conf — Desafio 04
#
# Coleta logs via rede (TCP/UDP 5514 interna) e organiza em:
#   /var/log/docker/<container>/<ano>/<mes>/<dia>.log
#
# DECISAO IMPORTANTE: usamos ${PROGRAM}, nao ${HOST}.
#   No RFC 5424, ${HOST} = nome da maquina (sempre "docker-desktop").
#   O tag do compose ("productivity-api", "productivity-postgres")
#   chega como ${PROGRAM} (campo APP-NAME do RFC 5424).
#   Por isso ${PROGRAM} e o que separa logs por container.
# ============================================================

source s_network {
    network(
        ip("0.0.0.0")
        port(5514)
        transport("tcp")
        flags(syslog-protocol)
    );
    network(
        ip("0.0.0.0")
        port(5514)
        transport("udp")
        flags(syslog-protocol)
    );
};

# Destino principal: logs separados por container (PROGRAM) e data
destination d_logs {
    file("/var/log/docker/${PROGRAM}/${YEAR}/${MONTH}/${DAY}.log"
        create_dirs(yes)
        dir-perm(0755)
        perm(0644)
    );
};

# Destino de erros: bucket separado, por data
destination d_errors {
    file("/var/log/docker/_errors/${YEAR}-${MONTH}-${DAY}.log"
        create_dirs(yes)
        dir-perm(0755)
        perm(0644)
    );
};

filter f_errors { level(err..emerg); };

log {
    source(s_network);
    destination(d_logs);
};

log {
    source(s_network);
    filter(f_errors);
    destination(d_errors);
};