name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Verificações rápidas (formatação)
  # Roda primeiro — falha em segundos se código mal formatado
  # ============================================================
  lint:
    name: Lint (Spotless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Spotless check
        run: ./mvnw -B spotless:check

  # ============================================================
  # Job 2: Build + testes + cobertura + SpotBugs
  # ============================================================
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    needs: lint  # só roda se o lint passar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build + test + SpotBugs + JaCoCo gate
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugs/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          echo "## 📊 Resultados do CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Descrição |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| jacoco-coverage-report | Cobertura de testes (HTML) |" >> $GITHUB_STEP_SUMMARY
          echo "| spotbugs-report | Bugs estáticos detectados |" >> $GITHUB_STEP_SUMMARY
          echo "| surefire-reports | Resultado dos testes unitários |" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Job 3: Scan de vulnerabilidades (OWASP)
  # Roda em paralelo com build-and-test pra não atrasar feedback
  # ============================================================
  security-scan:
    name: Security (OWASP Dependency Check)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Cache do banco da NVD — sem isso, baixa ~500MB toda vez
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-v1

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: OWASP Dependency Check
        run: ./mvnw -B org.owasp:dependency-check-maven:check
        continue-on-error: true  # primeira rodada: não bloqueia, só relata

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 7