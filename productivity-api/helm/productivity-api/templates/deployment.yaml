apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "productivity-api.fullname" . }}
  labels:
    {{- include "productivity-api.labels" . | nindent 4 }}
spec:
  # Se HPA está habilitado, NÃO setar replicas no Deployment.
  # Senão o HPA e o Deployment ficam brigando pelo número de pods
  # (o Deployment "reverte" o que o HPA escala). Trecho condicional cuida disso.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}

  selector:
    matchLabels:
      {{- include "productivity-api.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "productivity-api.selectorLabels" . | nindent 8 }}
      annotations:
        # Força rolling update quando o ConfigMap muda — sem isso,
        # Deployment não percebe mudança em ConfigMap e os pods continuam
        # com a config antiga até serem reiniciados manualmente.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.userKey }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.passwordKey }}

          envFrom:
            - configMapRef:
                name: {{ include "productivity-api.fullname" . }}-config

          # ====================================================
          # Probes — ordem importa: startup roda PRIMEIRO,
          # depois liveness e readiness começam a rodar em paralelo.
          # ====================================================
          {{- with .Values.probes.startup }}
          {{- if .enabled }}
          startupProbe:
            httpGet:
              path: {{ .path }}
              port: http
            failureThreshold: {{ .failureThreshold }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- end }}

          {{- with .Values.probes.liveness }}
          {{- if .enabled }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}

          {{- with .Values.probes.readiness }}
          {{- if .enabled }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}