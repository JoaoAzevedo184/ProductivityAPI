# ============================================================
# values.yaml — defaults da productivity-api
#
# Sobrescrevíveis via:
#   helm install ... -f values-dev.yaml
#   helm install ... --set replicaCount=3
# ============================================================

replicaCount: 1

image:
  repository: productivity-api
  tag: local
  # IfNotPresent: usa imagem local se existir, só baixa do registry se faltar.
  # No Kind, vamos carregar a imagem manualmente, então essa policy é importante.
  pullPolicy: IfNotPresent

service:
  type: ClusterIP   # só dentro do cluster (sem acesso externo nesta fase)
  port: 80          # porta do Service
  targetPort: 8080  # porta do container (Spring Boot)

# Configs NÃO-secretas (vão pro ConfigMap)
# Conexão com o Postgres da Fase 1
config:
  springProfilesActive: prod
  dbHost: postgres                          # nome do Service do Postgres
  dbPort: "5432"
  dbName: productivity
  javaOpts: "-Xms256m -Xmx512m"

# Credenciais sensíveis (referenciam Secret EXISTENTE — não criamos via Helm)
# O Secret 'postgres-credentials' já foi criado na Fase 1.
secrets:
  existingSecret: postgres-credentials
  userKey: POSTGRES_USER
  passwordKey: POSTGRES_PASSWORD

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

# ============================================================
# Probes — todas apontam pro Actuator do Spring Boot
#
# Três probes, três responsabilidades:
#   - startup:   "ainda tá subindo?" — protege liveness/readiness durante o boot
#   - liveness:  "ainda tá vivo?" — se falhar, K8s MATA e reinicia o pod
#   - readiness: "tá pronto pra tráfego?" — se falhar, K8s tira do Service (não mata)
#
# Por que startup importa: Spring Boot demora 15-30s pra subir. Sem startup probe,
# a liveness probe acharia que o pod está morto e mataria ele antes da JVM terminar
# o boot — clássico CrashLoopBackOff.
# ============================================================
probes:
  startup:
    enabled: true
    path: /actuator/health
    # failureThreshold × periodSeconds = tempo MÁXIMO de boot tolerado.
    # 30 × 5s = 150s. Generoso o suficiente pra Postgres lento, JIT frio, etc.
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    enabled: true
    path: /actuator/health/liveness
    initialDelaySeconds: 0    # startup já protege; pode começar imediato
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    path: /actuator/health/readiness
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# ============================================================
# Ingress — desligado por padrão (ClusterIP basta pra dev)
# Habilitado em values-prod.yaml
# ============================================================
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: productivity.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ============================================================
# HPA (Horizontal Pod Autoscaler) — desligado por padrão
# Habilitado em values-staging.yaml e values-prod.yaml
# ============================================================
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80   # opcional, descomentar se quiser

# ============================================================
# ServiceMonitor — expõe a productivity-api ao Prometheus (Desafio 05)
# Habilitado em values-dev.yaml, values-staging.yaml e values-prod.yaml
# ============================================================
serviceMonitor:
  enabled: false
  # releaseLabel: precisa casar com o serviceMonitorSelector do Prometheus.
  # O kube-prometheus-stack instalado com release name "kube-prom-stack"
  # procura ServiceMonitors com label "release: kube-prom-stack".
  releaseLabel: kube-prom-stack
  interval: 30s
  scrapeTimeout: 10s
  # namespace: ""   # vazio = mesmo namespace do release (recomendado)
