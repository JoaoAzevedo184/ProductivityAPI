server:
  port: 8080

spring:
  application:
    name: productivity-api
  profiles:
    active: dev   # default, sobrescrito por SPRING_PROFILES_ACTIVE em prod

  output:
    ansi:
      enabled: ALWAYS

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level){green} %clr(%logger{36}){cyan} - %msg%n"
  level:
    root: INFO
    org.springdoc: DEBUG
    org.springframework.web: DEBUG
    com.github.joaovictor: DEBUG