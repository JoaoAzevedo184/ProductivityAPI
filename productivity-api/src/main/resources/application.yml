server:
  port: 8080

spring:
  application:
    name: productivity-api
  profiles:
    active: dev   # default, sobrescrito por SPRING_PROFILES_ACTIVE em prod

  output:
    ansi:
      enabled: ALWAYS

  # Flyway: gerencia o schema de TODOS os ambientes (dev e prod).
  # Convenção: V<N>__descricao.sql em src/main/resources/db/migration/
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # útil em bancos pré-existentes (ex: futuro K8s)

# ============================================================
# Actuator: endpoints expostos + probes específicas pra K8s
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus    # ← adicione "prometheus"
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags: #
      application: ${spring.application.name}        # tag global em todas as métricas
      env: ${SPRING_PROFILES_ACTIVE:dev}             # diferencia dev/staging/prod no Grafana
    distribution:
      percentiles-histogram:
        http.server.requests: true   # Configurações específicas de métricas (ex: renomear, ignorar, etc.) podem ir aqui.

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level){green} %clr(%logger{36}){cyan} - %msg%n"
  level:
    root: INFO
    org.springdoc: DEBUG
    org.springframework.web: DEBUG
    com.github.joaovictor: DEBUG
    # Flyway é falador no INFO; eleva pra WARN se incomodar
    org.flywaydb: INFO