server:
  port: 8080

spring:
  application:
    name: productivity-api
  profiles:
    active: dev   # default, sobrescrito por SPRING_PROFILES_ACTIVE em prod

  output:
    ansi:
      enabled: ALWAYS

  # Flyway: gerencia o schema de TODOS os ambientes (dev e prod).
  # Convenção: V<N>__descricao.sql em src/main/resources/db/migration/
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # útil em bancos pré-existentes (ex: futuro K8s)

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level){green} %clr(%logger{36}){cyan} - %msg%n"
  level:
    root: INFO
    org.springdoc: DEBUG
    org.springframework.web: DEBUG
    com.github.joaovictor: DEBUG
    # Flyway é falador no INFO; eleva pra WARN se incomodar
    org.flywaydb: INFO