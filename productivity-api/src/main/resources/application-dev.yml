spring:
  datasource:
    # MODE=PostgreSQL: faz o H2 aceitar a sintaxe SQL do Postgres,
    # então as MESMAS migrations funcionam nos dois bancos.
    url: jdbc:h2:mem:taskdb-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    # Flyway é o dono do schema agora. Hibernate só valida.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # data.sql não roda mais — o seed virou V2__seed_initial_tasks.sql do Flyway.
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized